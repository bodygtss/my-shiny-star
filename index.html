<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Shiny Star✨</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  
    <!-- Lumn Light Layer (التوهج البنفسجي) -->
    <div id="lumn-layer">
      <div class="glow top"></div>
      <div class="glow bottom"></div>
      <div class="glow left"></div>
      <div class="glow right"></div>
    </div>
  
    <canvas id="sky"></canvas>
    <div id="stars"></div>
    <div class="edge" id="edge"></div>
  
    <div class="player">
      <button id="playBtn" aria-label="Play"></button>
      <div class="meta">
        <div class="title">Reflections - The Neighbourhood</div>
        <div class="bar" id="bar"><i id="fill"></i></div>
      </div>
    </div>
  
    <div class="banner" id="banner">
      <p id="msg" dir="auto"></p>
      <button id="replay" type="button">Replay</button>
    </div>
  
  <!-- Replace with your own licensed audio file -->
  <audio id="audio" src="Reflections.mp3" preload="auto" ></audio>

<script src="script.js">
</script>
</body>
</html>
